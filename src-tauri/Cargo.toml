[package]
name = "woo"
version = "0.1.0"
description = "Woo desktop Git client"
authors = ["Woo contributors"]
edition = "2021"

[lib]
name = "woo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread", "sync", "io-util"] }
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
